<!DOCTYPE html><html lang="it"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover"><meta name="apple-mobile-web-app-capable" content="yes"><meta name="theme-color" content="#0b1220"><title>Asta Radiati</title><style>:root{--bg:#0b1220;--card:#151f32;--border:#243044;--text:#e8eef7;--muted:#8b9bb4;--accent:#38bdf8;--green:#22c55e;--red:#ef4444;--orange:#f97316;--yellow:#eab308;--scarsenal:#0c4a6e}*{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent}body{font-family:-apple-system,BlinkMacSystemFont,'SF Pro Text',sans-serif;background:var(--bg);color:var(--text);padding:10px;max-width:820px;margin:0 auto;font-size:15px}h1{font-size:1.15rem;color:var(--accent)}.subtitle{color:var(--muted);font-size:.75rem;margin:2px 0 10px}.card{background:var(--card);border:1px solid var(--border);border-radius:12px;padding:11px;margin-bottom:10px}.credits-scroll{display:grid;grid-template-columns:1fr 1fr;gap:6px}@media(min-width:520px){.credits-scroll{grid-template-columns:1fr 1fr 1fr 1fr}}.team-chip{background:#0f1a2b;border:1px solid var(--border);border-radius:10px;padding:7px 8px;display:flex;align-items:center;gap:8px}.team-chip.scarsenal{background:var(--scarsenal);border-color:#0284c7}.team-chip .avatar{width:34px;height:34px;border-radius:7px;background:#1e293b;display:flex;align-items:center;justify-content:center;font-weight:700;color:#7dd3fc;flex-shrink:0}.team-chip .name{font-size:.68rem;color:var(--muted);font-weight:600}.team-chip.scarsenal .name{color:#7dd3fc}.team-chip .cr{font-size:1.05rem;font-weight:700}.cr.high{color:var(--green)}.cr.mid{color:var(--yellow)}.cr.low{color:var(--red)}.player-card{text-align:center;padding:16px 12px;background:linear-gradient(180deg,#0c4a6e,#151f32);border:1px solid #0369a1;border-radius:14px;margin-bottom:10px}.role-badge{display:inline-block;padding:3px 10px;border-radius:99px;font-size:.72rem;font-weight:700;margin-bottom:6px}.role-P{background:#1e3a5f;color:#7dd3fc}.role-D{background:#14532d;color:#86efac}.role-C{background:#713f12;color:#fde047}.role-A{background:#7f1d1d;color:#fca5a5}.player-name{font-size:1.55rem;font-weight:800}.player-meta{color:var(--muted);font-size:.88rem}.progress{font-size:.75rem;color:var(--muted);margin-top:8px}.target-box{display:none;margin-top:10px;background:#052e16;border:1px solid #16a34a;border-radius:10px;padding:10px 12px;text-align:left}.target-box.show{display:block}.target-box .max-line{font-size:1.05rem;font-weight:700;color:#86efac}.target-box .max-line span{color:var(--orange);font-size:1.2rem}.target-box .alts{font-size:.8rem;color:#bbf7d0;margin-top:4px}.actions{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-bottom:10px}.btn{border:none;border-radius:12px;padding:14px 10px;font-weight:700;font-size:1rem;min-height:52px}.btn-pass{background:#334155;color:#e2e8f0}.btn-buy{background:var(--green);color:#052e16}.btn:disabled{opacity:.4}.assign-panel{display:none;background:#0f1a2b;border:1px solid var(--border);border-radius:12px;padding:12px;margin-bottom:10px}.assign-panel.open{display:block}label{display:block;font-size:.7rem;color:var(--muted);margin-bottom:3px;font-weight:600;text-transform:uppercase}select,input[type=number]{width:100%;background:#0b1220;border:1px solid var(--border);color:var(--text);border-radius:10px;padding:11px 12px;font-size:16px}.row-2{display:grid;grid-template-columns:1fr 90px;gap:8px;margin-bottom:10px}.btn-confirm{width:100%;background:var(--green);color:#052e16}.role-jump{display:grid;grid-template-columns:repeat(4,1fr);gap:6px;margin-bottom:10px}.role-btn{background:#0f1a2b;border:1px solid var(--border);color:var(--muted);border-radius:10px;padding:9px 4px;font-weight:700;font-size:.85rem}.role-btn.active{border-color:var(--accent);color:var(--accent);background:#0c4a6e}.filter-row{display:flex;align-items:center;justify-content:space-between;margin-bottom:8px;font-size:.8rem;color:var(--muted)}.toggle{appearance:none;width:40px;height:22px;background:#334155;border-radius:99px;position:relative}.toggle:checked{background:var(--green)}.toggle::after{content:'';position:absolute;top:2px;left:2px;width:18px;height:18px;background:#fff;border-radius:50%;transition:.15s}.toggle:checked::after{left:20px}.log{max-height:140px;overflow-y:auto;background:#070d18;border-radius:10px;padding:7px 9px;font-size:.78rem}.log-entry{padding:4px 0;border-bottom:1px solid #1a2538}.log-entry strong{color:var(--accent)}.toolbar{display:flex;gap:8px;margin-top:8px}.btn-small{background:transparent;border:1px solid var(--border);color:var(--muted);border-radius:8px;padding:6px 11px;font-size:.78rem;font-weight:600}.mini-strat{font-size:.78rem;color:var(--muted);background:#0f1a2b;border-radius:10px;padding:8px 10px;margin-bottom:10px}.mini-strat strong{color:#7dd3fc}</style></head><body><h1>🎯 Tool Asta – Scarsenal</h1><p class="subtitle">Ordine: P → D → C → A (alfabetico) · Cassa 320</p><div class="card" style="padding:8px"><div class="credits-scroll" id="teams-list"></div></div><div class="role-jump" id="role-jump"></div><div class="filter-row"><span>Solo quot. ≥ 5</span><input type="checkbox" class="toggle" id="filter-quot" checked onchange="applyFilter()"></div><div class="player-card" id="player-card"><div class="role-badge role-P" id="role-badge">P</div><div class="player-name" id="player-name">—</div><div class="player-meta" id="player-meta">—</div><div class="progress" id="progress">—</div><div class="target-box" id="target-box"><div class="max-line" id="target-max"></div><div class="alts" id="target-alts"></div></div></div><div class="actions"><button class="btn btn-pass" id="btn-pass" onclick="passPlayer()">Passa →</button><button class="btn btn-buy" id="btn-buy" onclick="openAssign()">Assegna</button></div><div class="assign-panel" id="assign-panel"><div class="row-2"><div><label>Squadra</label><select id="team-select"></select></div><div><label>Crediti</label><input type="number" id="price-input" min="1" value="1" inputmode="numeric"></div></div><button class="btn btn-confirm" onclick="confirmAssign()">Conferma assegnazione</button></div><div class="mini-strat">Target: <strong>Vasquez</strong> (D28) · <strong>Kessiè</strong> (C40) · <strong>Woltemade</strong> (A65) · <strong>Beto</strong> (A55)<br>Arriva agli A con ≥ 200-220 crediti.</div><div class="card"><div class="log" id="log"></div><div class="toolbar"><button class="btn-small" onclick="resetCredits()">Reset crediti</button><button class="btn-small" onclick="clearLog()">Pulisci log</button></div></div><script>/* PLAYERS and logic loaded from compact build - see full file */

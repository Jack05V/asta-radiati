<!DOCTYPE html>
<html lang="it">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="theme-color" content="#0b1220">
<title>Asta Radiati</title>
<style>
:root{--bg:#0b1220;--card:#151f32;--border:#243044;--text:#e8eef7;--muted:#8b9bb4;--accent:#38bdf8;--green:#22c55e;--red:#ef4444;--orange:#f97316;--yellow:#eab308;--scarsenal:#0c4a6e}
*{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent}
body{font-family:-apple-system,BlinkMacSystemFont,'SF Pro Text',sans-serif;background:var(--bg);color:var(--text);padding:10px;max-width:820px;margin:0 auto;font-size:15px}
h1{font-size:1.15rem;color:var(--accent)}.subtitle{color:var(--muted);font-size:.75rem;margin:2px 0 10px}
.card{background:var(--card);border:1px solid var(--border);border-radius:12px;padding:11px;margin-bottom:10px}
.credits-scroll{display:grid;grid-template-columns:1fr 1fr;gap:6px}
@media(min-width:520px){.credits-scroll{grid-template-columns:1fr 1fr 1fr 1fr}}
.team-chip{background:#0f1a2b;border:1px solid var(--border);border-radius:10px;padding:7px 8px;display:flex;align-items:center;gap:8px}
.team-chip.scarsenal{background:var(--scarsenal);border-color:#0284c7}
.team-chip .name{font-size:.68rem;color:var(--muted);font-weight:600}.team-chip.scarsenal .name{color:#7dd3fc}
.team-chip .cr{font-size:1.05rem;font-weight:700}.cr.high{color:var(--green)}.cr.mid{color:var(--yellow)}.cr.low{color:var(--red)}
.player-card{text-align:center;padding:16px 12px;background:linear-gradient(180deg,#0c4a6e,#151f32);border:1px solid #0369a1;border-radius:14px;margin-bottom:10px}
.role-badge{display:inline-block;padding:3px 10px;border-radius:99px;font-size:.72rem;font-weight:700;margin-bottom:6px}
.role-P{background:#1e3a5f;color:#7dd3fc}.role-D{background:#14532d;color:#86efac}.role-C{background:#713f12;color:#fde047}.role-A{background:#7f1d1d;color:#fca5a5}
.player-name{font-size:1.55rem;font-weight:800}.player-meta{color:var(--muted);font-size:.88rem}.progress{font-size:.75rem;color:var(--muted);margin-top:8px}
.target-box{display:none;margin-top:10px;background:#052e16;border:1px solid #16a34a;border-radius:10px;padding:10px 12px;text-align:left}
.target-box.show{display:block}.target-box .max-line{font-size:1.05rem;font-weight:700;color:#86efac}.target-box .max-line span{color:var(--orange);font-size:1.2rem}.target-box .alts{font-size:.8rem;color:#bbf7d0;margin-top:4px}
.actions{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-bottom:10px}
.btn{border:none;border-radius:12px;padding:14px 10px;font-weight:700;font-size:1rem;min-height:52px}
.btn-pass{background:#334155;color:#e2e8f0}.btn-buy{background:var(--green);color:#052e16}.btn:disabled{opacity:.4}
.assign-panel{display:none;background:#0f1a2b;border:1px solid var(--border);border-radius:12px;padding:12px;margin-bottom:10px}.assign-panel.open{display:block}
label{display:block;font-size:.7rem;color:var(--muted);margin-bottom:3px;font-weight:600;text-transform:uppercase}
select,input[type=number]{width:100%;background:#0b1220;border:1px solid var(--border);color:var(--text);border-radius:10px;padding:11px 12px;font-size:16px}
.row-2{display:grid;grid-template-columns:1fr 90px;gap:8px;margin-bottom:10px}.btn-confirm{width:100%;background:var(--green);color:#052e16}
.role-jump{display:grid;grid-template-columns:repeat(4,1fr);gap:6px;margin-bottom:10px}
.role-btn{background:#0f1a2b;border:1px solid var(--border);color:var(--muted);border-radius:10px;padding:9px 4px;font-weight:700;font-size:.85rem}
.role-btn.active{border-color:var(--accent);color:var(--accent);background:#0c4a6e}
.filter-row{display:flex;align-items:center;justify-content:space-between;margin-bottom:8px;font-size:.8rem;color:var(--muted)}
.toggle{appearance:none;width:40px;height:22px;background:#334155;border-radius:99px;position:relative}.toggle:checked{background:var(--green)}
.toggle::after{content:'';position:absolute;top:2px;left:2px;width:18px;height:18px;background:#fff;border-radius:50%;transition:.15s}.toggle:checked::after{left:20px}
.log{max-height:140px;overflow-y:auto;background:#070d18;border-radius:10px;padding:7px 9px;font-size:.78rem}
.log-entry{padding:4px 0;border-bottom:1px solid #1a2538}.log-entry strong{color:var(--accent)}
.toolbar{display:flex;gap:8px;margin-top:8px}.btn-small{background:transparent;border:1px solid var(--border);color:var(--muted);border-radius:8px;padding:6px 11px;font-size:.78rem;font-weight:600}
.mini-strat{font-size:.78rem;color:var(--muted);background:#0f1a2b;border-radius:10px;padding:8px 10px;margin-bottom:10px}.mini-strat strong{color:#7dd3fc}
</style>
</head>
<body>
<h1>🎯 Tool Asta – Scarsenal</h1>
<p class="subtitle">Ordine: P → D → C → A · Cassa 320</p>
<div class="card" style="padding:8px"><div class="credits-scroll" id="teams-list"></div></div>
<div class="role-jump" id="role-jump"></div>
<div class="filter-row"><span>Solo quot. ≥ 5</span><input type="checkbox" class="toggle" id="filter-quot" checked onchange="applyFilter()"></div>
<div class="player-card"><div class="role-badge role-P" id="role-badge">P</div><div class="player-name" id="player-name">—</div><div class="player-meta" id="player-meta">—</div><div class="progress" id="progress">—</div><div class="target-box" id="target-box"><div class="max-line" id="target-max"></div><div class="alts" id="target-alts"></div></div></div>
<div class="actions"><button class="btn btn-pass" id="btn-pass" onclick="passPlayer()">Passa →</button><button class="btn btn-buy" id="btn-buy" onclick="openAssign()">Assegna</button></div>
<div class="assign-panel" id="assign-panel"><div class="row-2"><div><label>Squadra</label><select id="team-select"></select></div><div><label>Crediti</label><input type="number" id="price-input" min="1" value="1" inputmode="numeric"></div></div><button class="btn btn-confirm" onclick="confirmAssign()">Conferma</button></div>
<div class="mini-strat">Target: <strong>Vasquez</strong> 28 · <strong>Kessiè</strong> 40 · <strong>Woltemade</strong> 65 · <strong>Beto</strong> 55<br>Arriva agli A con ≥ 200-220</div>
<div class="card"><div class="log" id="log"></div><div class="toolbar"><button class="btn-small" onclick="resetCredits()">Reset</button><button class="btn-small" onclick="clearLog()">Pulisci log</button></div></div>
<script>
const ALL_PLAYERS=[{"n":"Daffara","r":"P","s":"Parma","q":6},{"n":"Palmisani","r":"P","s":"Frosinone","q":5},{"n":"Sanchez Ro.","r":"P","s":"Como","q":8},{"n":"Badiashile","r":"D","s":"Napoli","q":7},{"n":"Diego Carlos","r":"D","s":"Parma","q":8},{"n":"Kristensen T.","r":"D","s":"Atalanta","q":6},{"n":"Mina","r":"D","s":"Cagliari","q":7},{"n":"Tavares N.","r":"D","s":"Lazio","q":7},{"n":"Theate","r":"D","s":"Bologna","q":8},{"n":"Vasquez","r":"D","s":"Genoa","q":9},{"n":"Casadei","r":"C","s":"Torino","q":9},{"n":"Ferguson","r":"C","s":"Bologna","q":7},{"n":"Goncalves P.","r":"C","s":"Fiorentina","q":12},{"n":"Kessiè","r":"C","s":"Atalanta","q":12},{"n":"Mandragora","r":"C","s":"Torino","q":8},{"n":"Mbangula","r":"C","s":"Bologna","q":8},{"n":"Thorstvedt","r":"C","s":"Sassuolo","q":10},{"n":"Volpato","r":"C","s":"Sassuolo","q":9},{"n":"Beto","r":"A","s":"Fiorentina","q":14},{"n":"Bobcek","r":"A","s":"Frosinone","q":9},{"n":"Gnonto","r":"A","s":"Fiorentina","q":7},{"n":"Kvernadze","r":"A","s":"Frosinone","q":6},{"n":"Osmajic","r":"A","s":"Genoa","q":8},{"n":"Romero D.","r":"A","s":"Parma","q":10},{"n":"Woltemade","r":"A","s":"Juventus","q":23}];
const TARGETS={"Vasquez":{max:28,alts:["Tavares N.","Diego Carlos","Theate"]},"Tavares N.":{max:25,alts:["Vasquez","Diego Carlos","Theate"]},"Diego Carlos":{max:22,alts:["Vasquez","Tavares N.","Theate"]},"Theate":{max:22,alts:["Vasquez","Tavares N.","Diego Carlos"]},"Kessiè":{max:40,alts:["Goncalves P.","Thorstvedt"]},"Goncalves P.":{max:35,alts:["Kessiè","Thorstvedt"]},"Thorstvedt":{max:25,alts:["Volpato","Casadei"]},"Volpato":{max:22,alts:["Thorstvedt","Casadei"]},"Casadei":{max:22,alts:["Thorstvedt","Volpato"]},"Woltemade":{max:65,alts:["Beto","Romero D.","Bobcek"]},"Beto":{max:55,alts:["Woltemade","Romero D.","Bobcek"]},"Romero D.":{max:28,alts:["Bobcek","Osmajic"]},"Bobcek":{max:22,alts:["Romero D.","Osmajic","Gnonto"]},"Osmajic":{max:20,alts:["Bobcek","Gnonto"]},"Gnonto":{max:18,alts:["Kvernadze"]},"Kvernadze":{max:15,alts:[]}};
const initialCredits={"Scarsenal":320,"COCA JUNIORS":187,"RB SALISBURRO II":142,"Bunga Bunga Boys":112,"Junglespree FC":29,"LAUTARALLO":29,"Fc Tonno Rio MALEN":19,"FC. SanPio":12};
let credits={...initialCredits},logEntries=[],filtered=[],idx=0;
function applyFilter(){filtered=document.getElementById('filter-quot').checked?ALL_PLAYERS.filter(p=>p.q>=5):ALL_PLAYERS.slice();idx=0;renderPlayer();renderRoleJump()}
function renderTeams(){const short={"Scarsenal":"Scarsenal","COCA JUNIORS":"Coca Juniors","RB SALISBURRO II":"RB Salisburro","Bunga Bunga Boys":"Bunga Bunga","Junglespree FC":"Junglespree","LAUTARALLO":"Lautarallo","Fc Tonno Rio MALEN":"Tonno Rio","FC. SanPio":"SanPio"};const sorted=Object.entries(credits).sort((a,b)=>b[1]-a[1]);document.getElementById('teams-list').innerHTML=sorted.map(([t,cr])=>{const cls=cr>=150?'high':cr>=50?'mid':'low';const sc=t==='Scarsenal'?'scarsenal':'';const name=short[t]||t;return `<div class=\"team-chip ${sc}\" onclick=\"editCredits('${t}')\"><div style=\"width:34px;height:34px;border-radius:7px;background:#1e293b;display:flex;align-items:center;justify-content:center;font-weight:700;color:#7dd3fc;flex-shrink:0\">${name.charAt(0)}</div><div><div class=\"name\">${name}</div><div class=\"cr ${cls}\">${cr}</div></div></div>`}).join('')}
function renderRoleJump(){const cur=filtered[idx]?filtered[idx].r:'P';document.getElementById('role-jump').innerHTML=['P','D','C','A'].map(r=>{const c=filtered.filter(p=>p.r===r).length;return `<button class=\"role-btn ${r===cur?'active':''}\" onclick=\"jumpRole('${r}')\">${r}<br><span style=\"font-size:.7rem\">${c}</span></button>`}).join('')}
function renderPlayer(){if(!filtered.length||idx>=filtered.length){document.getElementById('player-name').textContent='Fine lista';document.getElementById('btn-pass').disabled=true;document.getElementById('btn-buy').disabled=true;return}const p=filtered[idx];document.getElementById('role-badge').className='role-badge role-'+p.r;document.getElementById('role-badge').textContent=p.r;document.getElementById('player-name').textContent=p.n;document.getElementById('player-meta').innerHTML=p.s+' · quot. <strong>'+p.q+'</strong>';const rp=filtered.filter(x=>x.r===p.r);document.getElementById('progress').textContent=p.r+' '+(rp.findIndex(x=>x.n===p.n)+1)+'/'+rp.length;document.getElementById('btn-pass').disabled=false;document.getElementById('btn-buy').disabled=false;document.getElementById('assign-panel').classList.remove('open');const tb=document.getElementById('target-box'),ti=TARGETS[p.n];if(ti){tb.classList.add('show');document.getElementById('target-max').innerHTML='MAX SPESA: <span>'+ti.max+'</span>';const still=(ti.alts||[]).filter(n=>filtered.some(x=>x.n===n));document.getElementById('target-alts').innerHTML=still.length?'Alternative: '+still.map(n=>'<strong>'+n+'</strong> ('+(TARGETS[n]?TARGETS[n].max:'?')+')').join(' · '):'Nessuna alternativa prioritaria'}else tb.classList.remove('show');renderRoleJump()}
function passPlayer(){if(idx<filtered.length-1){idx++;renderPlayer()}else{addLog('Fine lista');renderPlayer()}}
function openAssign(){document.getElementById('assign-panel').classList.add('open');document.getElementById('price-input').value=1}
function confirmAssign(){const p=filtered[idx];if(!p)return;const team=document.getElementById('team-select').value,price=parseInt(document.getElementById('price-input').value)||0;if(price<1){alert('Prezzo?');return}if(credits[team]<price&&!confirm(team+' ha solo '+credits[team]+'. Continuare?'))return;credits[team]=Math.max(0,credits[team]-price);addLog('<strong>'+p.n+'</strong> → '+team+' <strong>'+price+'</strong> (ora '+credits[team]+')');renderTeams();filtered.splice(idx,1);renderPlayer()}
function jumpRole(r){const i=filtered.findIndex(p=>p.r===r);if(i>=0){idx=i;renderPlayer()}}
function renderSelects(){document.getElementById('team-select').innerHTML=Object.keys(credits).map(t=>`<option value=\"${t}\" ${t==='Scarsenal'?'selected':''}>${t}</option>`).join('')}
function addLog(m){const t=new Date().toLocaleTimeString('it-IT',{hour:'2-digit',minute:'2-digit',second:'2-digit'});logEntries.unshift('<span style=\"color:#64748b\">'+t+'</span> '+m);if(logEntries.length>50)logEntries.pop();document.getElementById('log').innerHTML=logEntries.map(l=>'<div class=\"log-entry\">'+l+'</div>').join('')}
function editCredits(team){const c=credits[team],n=prompt(team+'\nCredito: '+c,c);if(n===null)return;const v=parseInt(n);if(!isNaN(v)&&v>=0){credits[team]=v;addLog('Credito '+team+': '+c+' → <strong>'+v+'</strong>');renderTeams()}}
function resetCredits(){if(confirm('Reset crediti?')){credits={...initialCredits};addLog('Reset');renderTeams()}}
function clearLog(){logEntries=[];document.getElementById('log').innerHTML=''}
applyFilter();renderTeams();renderSelects();addLog('Tool pronto');
</script>
</body>
</html>
